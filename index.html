<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Legend of Torn — Interactive Map</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#090909;color:#eee;font-family:Arial,Helvetica,sans-serif;height:100%}body{overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}header{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #333;background:#111;gap:12px}
h1{font-size:20px;letter-spacing:2px;margin:0}.subtitle{font-size:12px;color:#aaa;margin-top:2px}.header-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
button{background:#252525;color:#eee;border:1px solid #555;border-radius:4px;padding:8px 11px;cursor:pointer;font-weight:700}button:hover{background:#333}button.danger{border-color:#713b3b}.small{padding:5px 8px;font-size:11px}
main{min-height:0;flex:1;display:flex}#palette{width:250px;flex:0 0 250px;background:#121212;border-right:1px solid #333;padding:10px;overflow-y:auto}
.palette-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}#selectionText{font-size:11px;line-height:1.35;color:#aaa;margin-bottom:10px;min-height:30px}
#iconGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.icon-btn{height:43px;padding:3px;display:flex;align-items:center;justify-content:center;background:#1d1d1d}
.icon-btn img{width:24px;height:24px;image-rendering:pixelated}.icon-btn.selected{outline:2px solid #eee;background:#444}
#viewer{position:relative;flex:1;min-width:0;overflow:hidden;background:#000;cursor:grab;touch-action:none}#viewer.panning{cursor:grabbing}#viewer.stamping{cursor:crosshair}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none}#worldMap{display:block;width:2048px;height:1697px;image-rendering:pixelated;pointer-events:none}
#markers{position:absolute;inset:0}.marker{position:absolute;width:24px;height:24px;transform:translate(-50%,-50%);cursor:move;image-rendering:pixelated;filter:drop-shadow(0 1px 1px #000);touch-action:none}
.marker.selected{outline:2px solid #fff;outline-offset:2px}#help{position:absolute;left:10px;bottom:10px;right:10px;background:rgba(0,0,0,.78);border:1px solid #444;padding:7px 9px;font-size:11px;color:#bbb;pointer-events:none}
#help b{color:#eee;margin-left:10px}#help b:first-child{margin-left:0}
#toolGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:7px 0 12px}.tool-btn{padding:7px 3px;font-size:11px}.tool-btn.selected{outline:2px solid #eee;background:#444}.map-note{position:absolute;transform:translate(-50%,-50%);max-width:220px;padding:4px 6px;background:rgba(0,0,0,.78);border:1px solid #888;border-radius:3px;color:#fff;font-size:12px;white-space:pre-wrap;cursor:move;user-select:none;touch-action:none}.map-note.selected{outline:2px solid #fff}.marker-tooltip{display:none;position:absolute;left:14px;top:-12px;z-index:20;max-width:240px;padding:5px 7px;background:rgba(0,0,0,.9);border:1px solid #888;border-radius:3px;color:#fff;font:12px Arial,sans-serif;line-height:1.3;white-space:pre-wrap;pointer-events:none}.marker-wrap:hover .marker-tooltip{display:block}.marker-note-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;border:1px solid #000;transform:translate(7px,-17px);pointer-events:none}#drawLayer{position:absolute;inset:0;width:2048px;height:1697px;overflow:visible;pointer-events:auto}.draw-hit{pointer-events:stroke;cursor:move}
#drawLayer{z-index:2;pointer-events:none}
#markers,#notesLayer{position:absolute;inset:0;pointer-events:none;z-index:3}
#markers .marker,#notesLayer .map-note{pointer-events:auto}
.draw-hit{pointer-events:stroke!important;cursor:move}

@media(max-width:720px){header{height:auto;flex:0 0 auto;align-items:flex-start}h1{font-size:16px}.header-actions button{padding:6px 8px}main{flex-direction:column}#palette{width:100%;flex:0 0 116px;border-right:0;border-bottom:1px solid #333;overflow-y:auto;padding:7px}#iconGrid{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px}.icon-btn{min-width:43px}.palette-head{margin-bottom:3px}#selectionText{display:none}#help{display:none}}
</style>
</head>

<div id="app">
<header><div><h1>LEGEND OF TORN</h1><div class="subtitle">Interactive Map — V1.5</div></div>

function syncMarkerNoteButton(){const m=markers.find(x=>x.id===selectedMarker);editMarkerNote.style.display=m?"block":"none";markerNoteRead.style.display=m&&m.note?"block":"none";if(m){editMarkerNote.textContent=m.note?"Edit Icon Note":"Add Icon Note";markerNoteRead.textContent=m.note||""}}

function renderMarkers(){markerLayer.innerHTML="";for(const m of markers){const w=document.createElement("div");w.className="marker-wrap";w.style.position="absolute";w.style.left=(m.x*100)+"%";w.style.top=(m.y*100)+"%";const img=document.createElement("img");img.className="marker"+(m.id===selectedMarker?" selected":"");img.src=iconByFile[m.icon];img.style.left="0";img.style.top="0";img.draggable=false;

el.onpointermove=e=>{if(draggingNote!==n.id)return;const p=mapPoint(e.clientX,e.clientY);n.x=Math.max(0,Math.min(1,p.x/MAP_W));n.y=Math.max(0,Math.min(1,p.y/MAP_H));el.style.left=n.x*100+"%";el.style.top=n.y*100+"%"};
el.onpointerup=()=>{draggingNote=null;save()};el.ondblclick=e=>{e.stopPropagation();const v=prompt("Edit map note:",n.text);if(v!==null){if(v.trim())n.text=v.trim();else notes=notes.filter(x=>x.id!==n.id);save();renderNotes()}};

function renderLines(){drawLayer.innerHTML='<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="white"/></marker></defs>';for(const l of lines){const vis=document.createElementNS("http://www.w3.org/2000/svg","line");for(const [k,v] of [["x1",l.x1*MAP_W],["y1",l.y1*MAP_H],["x2",l.x2*MAP_W],["y2",l.y2*MAP_H]])vis.setAttribute(k,v);vis.setAttribute("stroke","white");vis.setAttribute("stroke-width","3");vis.setAttribute("stroke-linecap","round");vis.style.pointerEvents="none";if(l.arrow)vis.setAttribute("marker-end","url(#ah)");drawLayer.appendChild(vis);const hit=document.createElementNS("http://www.w3.org/2000/svg","line");for(const k of ["x1","y1","x2","y2"])hit.setAttribute(k,vis.getAttribute(k));hit.setAttribute("stroke","rgba(0,0,0,.001)");hit.setAttribute("stroke-width","24");hit.setAttribute("class","draw-hit");hit.style.pointerEvents="stroke";let moving=false,last=null;hit.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();e.stopPropagation();moving=true;last=mapPoint(e.clientX,e.clientY);hit.setPointerCapture(e.pointerId)};hit.onpointermove=e=>{if(!moving)return;const p=mapPoint(e.clientX,e.clientY),dx=(p.x-last.x)/MAP_W,dy=(p.y-last.y)/MAP_H;last=p;l.x1=Math.max(0,Math.min(1,l.x1+dx));l.y1=Math.max(0,Math.min(1,l.y1+dy));l.x2=Math.max(0,Math.min(1,l.x2+dx));l.y2=Math.max(0,Math.min(1,l.y2+dy));for(const q of [vis,hit]){q.setAttribute("x1",l.x1*MAP_W);q.setAttribute("y1",l.y1*MAP_H);q.setAttribute("x2",l.x2*MAP_W);q.setAttribute("y2",l.y2*MAP_H)}};hit.onpointerup=()=>{if(moving){moving=false;save()}};hit.onlostpointercapture=()=>{if(moving){moving=false;save()}};hit.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();lines=lines.filter(x=>x.id!==l.id);save();renderLines()};drawLayer.appendChild(hit)}if(drawing){const q=document.createElementNS("http://www.w3.org/2000/svg","line");["x1","y1","x2","y2"].forEach(k=>q.setAttribute(k,drawing[k]));q.setAttribute("stroke","white");q.setAttribute("stroke-width","3");q.setAttribute("stroke-dasharray","8 6");if(drawing.arrow)q.setAttribute("marker-end","url(#ah)");drawLayer.appendChild(q)}}

panning=true;viewer.classList.add("panning");viewer.setPointerCapture(e.pointerId);panStart={x:e.clientX,y:e.clientY,tx,ty}};
viewer.onpointermove=e=>{if(drawing){const p=mapPoint(e.clientX,e.clientY);drawing.x2=Math.max(0,Math.min(MAP_W,p.x));drawing.y2=Math.max(0,Math.min(MAP_H,p.y));renderLines();return}if(panning){tx=panStart.tx+e.clientX-panStart.x;ty=panStart.ty+e.clientY-panStart.y;applyTransform()}};
viewer.onpointerup=()=>{if(drawing){if(Math.hypot(drawing.x2-drawing.x1,drawing.y2-drawing.y1)>5)lines.push({id:uid(),x1:drawing.x1/MAP_W,y1:drawing.y1/MAP_H,x2:drawing.x2/MAP_W,y2:drawing.y2/MAP_H,arrow:drawing.arrow});drawing=null;save();renderLines()}panning=false;viewer.classList.remove("panning")};
viewer.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest(".marker,.map-note,.draw-hit"))return;if(selectedIcon||activeTool){e.preventDefault();cancelCurrentTool()}});
viewer.addEventListener("wheel",e=>{e.preventDefault();const r=viewer.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});
viewer.onkeydown=e=>{if(e.key==="Escape")cancelCurrentTool()};
document.getElementById("zoomIn").onclick=()=>{const r=viewer.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2)};
document.getElementById("zoomOut").onclick=()=>{const r=viewer.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2)};
document.getElementById("resetView").onclick=fit;document.getElementById("cancelStamp").onclick=cancelCurrentTool;
document.getElementById("clearAll").onclick=()=>{if((markers.length||notes.length||lines.length)&&confirm("Remove every marker, note, line, and arrow?")){markers=[];notes=[];lines=[];save();renderMarkers();renderNotes();renderLines()}};

document.getElementById("exportData").onclick=()=>{const payload={format:"Legend of Torn Interactive Map Data",version:2,exportedAt:new Date().toISOString(),markers,notes,lines};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="Legend-of-Torn-Map-Data.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)};
document.getElementById("importData").onclick=()=>importFile.click();
importFile.onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text()),im=Array.isArray(d)?d:(d.markers||[]),ino=d.notes||[],il=d.lines||[];if(!Array.isArray(im)||!Array.isArray(ino)||!Array.isArray(il)||!im.every(m=>iconByFile[m.icon]))throw 0;if((markers.length||notes.length||lines.length)&&!confirm("Replace all current map annotations with this file?")){e.target.value="";return}markers=im.map(m=>({...m,id:uid(),note:m.note||""}));notes=ino.map(n=>({...n,id:uid()}));lines=il.map(l=>({...l,id:uid()}));save();renderMarkers();renderNotes();renderLines();alert("Map data loaded.")}catch(x){alert("That file could not be loaded as Legend of Torn map data.")}e.target.value=""};

load();renderMarkers();renderNotes();renderLines();requestAnimationFrame(fit);
</script>
</body></html>
